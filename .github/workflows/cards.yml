# Every claim on the profile page, resolved against the repository it points at.
#
# This runs on a schedule as well as on push, and the schedule is the point: the page
# makes claims about repositories that change after the page is written. A check that only
# runs when somebody edits the page cannot catch a command being renamed somewhere else.
name: cards

on:
  push:
  pull_request:
  schedule:
    # Weekly. The repositories move slowly; a card that has gone stale is worth finding
    # within a week and is not worth a daily job.
    - cron: "17 6 * * 1"

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The history is an input: one check reads commit subjects to confirm each
          # constraint landed as its own commit. The default shallow checkout fetches one
          # commit, and that check fails rather than skips, which is the right way round.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: python3 -m pip install --upgrade pip && pip install -e ".[verify]"

      - name: the page is what its source renders
        # --check, not a render. Rendering here rewrites README.md on the runner and makes
        # the reproduction test true before it runs, so a hand edit pushed to the page
        # GitHub serves would pass CI green. A review demonstrated exactly that.
        run: python3 scripts/render_readme.py --check

      - name: every card resolves
        # The token is for the API rate limit on the repository listing, nothing else.
        # Every repository read here is public.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m pytest tests -v
