# The profile page's source. scripts/render_readme.py turns this into README.md and
# tests/ resolves every binding below against the live repository.
#
# Adding a repository is adding a card here. The positioning and the layout are not
# touched, which is the whole reason the page is generated rather than written.

name: Marc Alexander

# Three lines is the ceiling, and the check enforces it. A reader who needs four lines of
# preamble has already left.
positioning:
  - "Hands-on software architect and engineering lead turning ambiguous business problems into working systems across full-stack software, distributed systems, cloud platforms and applied AI."
  - "Thirty years across defense, intelligence and federal healthcare, including DIA and DHA TRICARE, leading teams, modernizing platforms and supporting mission-critical operations. Previously held DHA NAC suitability and TS/SCI with full-scope polygraph."
  - "Define it. Build it. Prove it. Operate it. The projects below demonstrate architecture choices, implementation tradeoffs and verifiable outcomes through runnable demos, tests and delivery checks."

cards:
# Card order on the page is the order of the blocks below, and nothing else sorts
# them: the renderer walks this mapping and the account is consulted only for the
# SET of repositories, never for their sequence. To reorder the page, move a block.
  abyss-write-gate:
    technologies:
      - {"name": "Python", "url": "https://img.shields.io/badge/Python-3776AB?logo=python&logoColor=white"}
      - {"name": "SQLite", "url": "https://img.shields.io/badge/SQLite-003B57?logo=sqlite&logoColor=white"}
    line: "A compromised agent attacks its own write boundary, and the misses are published too."
    proves: >-
      A hostile driver replaces the model and attempts every forbidden state change it can
      reach against an approval workflow; a deterministic gate at the write boundary
      refuses them and no forbidden mutation lands. The part usually left out is committed
      beside it: the cases the gate does NOT catch, generated from the same run rather than
      written up afterwards, with a test asserting the missed set is non-empty on the
      grounds that a gate with no published blind spot has not been probed hard enough.
    bindings:
      - kind: command
        value: "make demo"
        path: "Makefile"
      - kind: gate
        value: "RST-C5"
        path: "tests/test_rst_c5_known_miss_register.py"
      - kind: artifact
        value: "docs/KNOWN-MISSES.md"
        path: "docs/KNOWN-MISSES.md"
  interview-eval-platform:
    technologies:
      - {"name": "Python", "url": "https://img.shields.io/badge/Python-3776AB?logo=python&logoColor=white"}
      - {"name": "FastAPI", "url": "https://img.shields.io/badge/FastAPI-009688?logo=fastapi&logoColor=white"}
      - {"name": "SQLAlchemy", "url": "https://img.shields.io/badge/SQLAlchemy-D71F00?logo=sqlalchemy&logoColor=white"}
      - {"name": "SQLite", "url": "https://img.shields.io/badge/SQLite-003B57?logo=sqlite&logoColor=white"}
    line: "A model decides something about a person, and the record of it is tamper-evident."
    proves: >-
      An LLM scores interview answers against a rubric, and anything below a confidence
      threshold routes to a human rather than standing on its own. The model's verdict and
      the routed verdict are stored separately and nothing is overwritten. The audit log is
      hash-chained, and its negative tests drop the SQLite append-only triggers first,
      standing in for direct database access, before asserting the verifier still catches
      an edited payload, a deleted entry and a rewritten hash. Testing the verifier against
      a clean chain would have proved nothing; that is the whole difference.
    bindings:
      - kind: command
        # The command is documented in that repository's README rather than inside the
        # module it starts, so the binding says so. Declared per binding, because a blanket
        # fallback to the README dissolves the rename this check exists to catch.
        value: "uvicorn app.main:app --reload"
        path: "app/main.py"
        states: "README.md"
      - kind: gate
        value: "test_verifier_detects_an_edited_payload"
        path: "tests/test_audit_chain.py"
      - kind: gate
        value: "test_ambiguous_answer_routes_to_human_review"
        path: "tests/test_evaluation.py"
      - kind: artifact
        value: "app/domain/hashing.py"
        path: "app/domain/hashing.py"

  abyss-polyglot:
    technologies:
      - {"name": "Java", "url": "https://img.shields.io/badge/Java-ED8B00?logo=openjdk&logoColor=white"}
      - {"name": "Python", "url": "https://img.shields.io/badge/Python-3776AB?logo=python&logoColor=white"}
      - {"name": "Spring", "url": "https://img.shields.io/badge/Spring-6DB33F?logo=spring&logoColor=white"}
      - {"name": "Spring Boot", "url": "https://img.shields.io/badge/Spring%20Boot-6DB33F?logo=springboot&logoColor=white"}
      - {"name": "Angular", "url": "https://img.shields.io/badge/Angular-DD0031?logo=angular&logoColor=white"}
      - {"name": "React", "url": "https://img.shields.io/badge/React-20232A?logo=react&logoColor=white"}
      - {"name": "TypeScript", "url": "https://img.shields.io/badge/TypeScript-3178C6?logo=typescript&logoColor=white"}
      - {"name": "PostgreSQL", "url": "https://img.shields.io/badge/PostgreSQL-4169E1?logo=postgresql&logoColor=white"}
      - {"name": "Docker", "url": "https://img.shields.io/badge/Docker-2496ED?logo=docker&logoColor=white"}
      - {"name": "OpenAPI", "url": "https://img.shields.io/badge/OpenAPI-6BA539?logo=openapiinitiative&logoColor=white"}
    line: "One contract. Several runtimes. One suite that names none of them."
    proves: >-
      One OpenAPI contract, served by JVM and Python backends and consumed by two
      frontend frameworks, with one test suite that runs unmodified against all of them
      and names none of them. Identity is read from the live classpath rather than from a
      label, so the stacks cannot be mislabelled and pass. It runs from a single command
      on a bare interpreter, with nothing installed.
    bindings:
      - kind: command
        value: "python3 demo.py"
        path: "demo.py"
      - kind: gate
        value: "R-8"
        path: "tests/test_r08_the_demo_runs_on_a_bare_interpreter.py"
      - kind: artifact
        value: "contract/openapi.yaml"
        path: "contract/openapi.yaml"

  abyss-trade-workflow:
    technologies:
      - {name: Go, logo: go, color: "00ADD8"}
      - {name: Java, logo: openjdk, color: "ED8B00"}
      - {name: React, logo: react, color: "20232A"}
      - {name: TypeScript, logo: typescript, color: "3178C6"}
      - {name: PostgreSQL, logo: postgresql, color: "4169E1"}
      - {name: Kafka, logo: apachekafka, color: "231F20"}
      - {name: Docker, logo: docker, color: "2496ED"}
    line: "One trade workflow in Go and Java, with durable events and live browser updates."
    proves: >-
      Both implementations pair a React portal with PostgreSQL transactional outboxes
      and Kafka workers. The Java edition consumes completion events in the API and
      delivers authenticated SSE notifications over one persistent browser subscription;
      the Go baseline polls for status. Concurrent submissions and duplicate event
      delivery are checked against PostgreSQL for one decision and audit trail. The
      recorded Java demonstration shows submission and worker recovery, and both
      implementations have CI tests and container security scans. The comparison
      documents the delivery differences; it makes no performance claim.
    bindings:
      - kind: command
        value: "./demo java"
        path: "demo"
        states: "README.md"
      - kind: command
        value: "./demo go"
        path: "demo"
        states: "README.md"
      - kind: gate
        value: "concurrentSubmitsAndDuplicateEventsProduceOneDecision"
        path: "implementations/java/src/test/java/com/abyssapplied/trade/service/WorkflowIT.java"
      - kind: artifact
        value: "docs/media/trade-workflow.gif"
        path: "docs/media/trade-workflow.gif"
      - kind: artifact
        value: "docs/go-vs-java.md"
        path: "docs/go-vs-java.md"

  abyss-independent-authority:
    technologies:
      - {"name": "Java 21", "url": "https://img.shields.io/badge/Java-21-ED8B00?logo=openjdk&logoColor=white"}
      - {"name": "CrewAI", "url": "https://img.shields.io/badge/CrewAI-1.15-6C47FF"}
      - {"name": "Semantic Kernel", "url": "https://img.shields.io/badge/Semantic_Kernel-1.44-5E5E5E?logo=microsoft"}
      - {"name": "LangGraph", "url": "https://img.shields.io/badge/LangGraph-1.2-1C3C3C"}
      - {"name": "LangChain", "url": "https://img.shields.io/badge/LangChain-1.6-1C3C3C"}
    line: "Four agent frameworks request the same capability. None can authorize itself."
    proves: >-
      CrewAI, Semantic Kernel, LangGraph and LangChain each submit through their native
      execution model to one deterministic Java authority boundary. A valid request
      proceeds; missing evidence, an invented approval and the wrong capability are
      denied. The frameworks change. The authority does not.
    bindings:
      - kind: command
        value: "./demo"
        path: "demo"
        states: "README.md"
      - kind: gate
        value: "CAPABILITY_NOT_GRANTED"
        path: "java/com/abyss/authority/AuthorityDemo.java"
      - kind: artifact
        value: "run_demo.py"
        path: "run_demo.py"

  abyss-medicare-stars-agent:
    technologies:
      - {"name": "Python", "url": "https://img.shields.io/badge/Python-3.11-3776AB?logo=python&logoColor=white"}
      - {"name": "Google ADK", "url": "https://img.shields.io/badge/Google_ADK-2.9.2%2B-4285F4?logo=googlecloud&logoColor=white"}
      - {"name": "Vertex AI", "url": "https://img.shields.io/badge/Vertex_AI-Managed_API-4285F4?logo=googlecloud&logoColor=white"}
      - {"name": "Gemini", "url": "https://img.shields.io/badge/Gemini-2.5_Flash-8E75B2?logo=googlegemini&logoColor=white"}
      - {"name": "MCP SDK", "url": "https://img.shields.io/badge/MCP_SDK-%3E%3D1.12%2C%3C2-00A67E"}
      - {"name": "FastMCP", "url": "https://img.shields.io/badge/FastMCP-SDK_server-7C3AED"}
      - {"name": "BigQuery", "url": "https://img.shields.io/badge/BigQuery-Standard_SQL-669DF6?logo=googlebigquery&logoColor=white"}
      - {"name": "Cloud Run", "url": "https://img.shields.io/badge/Cloud_Run-Private-4285F4?logo=googlecloud&logoColor=white"}
      - {"name": "Cloud Build", "url": "https://img.shields.io/badge/Cloud_Build-CI%2FCD-4285F4?logo=googlecloud&logoColor=white"}
      - {"name": "FastAPI", "url": "https://img.shields.io/badge/FastAPI-0.116%2B-009688?logo=fastapi&logoColor=white"}
      - {"name": "OCI", "url": "https://img.shields.io/badge/Container-OCI-2496ED?logo=docker&logoColor=white"}
      - {"name": "Trivy", "url": "https://img.shields.io/badge/Trivy-HIGH%2FCRITICAL_gate-1904DA?logo=aqua&logoColor=white"}
    line: "A Medicare Stars agent can use an LLM without surrendering evidence, authority or cost control."
    proves: >-
      Google ADK orchestrates Vertex AI Gemini through an MCP/FastMCP tool boundary
      to analyze aggregate-only BigQuery evidence. Deterministic policy rejects PHI
      and unrelated tool use, evaluations gate releases, Trivy scans the OCI image,
      and the private Cloud Run deployment reports per-request token and estimated
      cost telemetry. The model reasons. It does not authorize itself.
    bindings:
      - kind: command
        value: "./demo --local"
        path: "demo"
        states: "README.md"
      - kind: gate
        value: "./evaluate"
        path: "evaluate"
        states: "README.md"
      - kind: artifact
        value: "observability/llm_cost.py"
        path: "observability/llm_cost.py"

  abyss-medallion:
    technologies:
      - {"name": "Python", "url": "https://img.shields.io/badge/Python-3776AB?logo=python&logoColor=white"}
      - {"name": "SQLite", "url": "https://img.shields.io/badge/SQLite-003B57?logo=sqlite&logoColor=white"}
    line: "Bad ERP-like data stays visible, and reconciliation cannot waive its release gate."
    proves: >-
      Synthetic SAP ECC-like extracts move through exact Bronze snapshots, validated
      Silver records and S/4HANA-oriented Gold staging. Whole-document validation
      quarantines imbalanced and invalid records, record lineage connects target keys
      to source rows, and gross debit and credit reconcile separately by company and
      currency. Any unresolved quarantine blocks staging release. A corrected extract
      passes while the rejected batch remains inspectable. This is a data engineering
      reference, not a claim of actual SAP migration experience.
    bindings:
      - kind: command
        value: "./demo"
        path: "demo"
        states: "README.md"
      - kind: gate
        value: "test_defective_batch_blocks_release_and_conserves_every_row"
        path: "tests/test_pipeline.py"
      - kind: artifact
        value: "docs/CONTROL-REGISTER.md"
        path: "docs/CONTROL-REGISTER.md"

footer: >-
  The private work is client code and stays off this page. Every other public repository
  has a card, this one excepted, since a card pointing at the page it is printed on says
  nothing. The set is read from the account rather than from a list kept here, so a
  repository going public without a card is a gap that fails rather than a thing somebody
  has to remember. The claims on this page are resolved against their repositories by a check that runs weekly.
